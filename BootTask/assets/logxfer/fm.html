<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>车机文件（手机遥控）</title>
<style>
  html,body{margin:0;padding:0;background:#101014;color:#E8E6F0;
    font-family:-apple-system,'PingFang SC','Microsoft YaHei',Arial,sans-serif;
    -webkit-text-size-adjust:100%}
  header{position:sticky;top:0;background:#17161D;padding:10px 12px 8px;
    border-bottom:1px solid #26242E;z-index:5}
  .crumb{font-size:13px;color:#8FB2FF;word-break:break-all;line-height:1.4}
  .bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  button{background:#23212B;color:#DCD9E6;border:1px solid #33303C;border-radius:6px;
    padding:7px 10px;font-size:12px}
  button:active{background:#2E2B38}
  button.pri{background:#4C6EF5;border-color:#4C6EF5;color:#fff}
  button.danger{background:#3A1D22;border-color:#5A2A32;color:#FF9AA6}
  input[type=text],textarea{background:#0C0C10;color:#E8E6F0;border:1px solid #33303C;
    border-radius:6px;padding:8px;font-size:14px;width:100%;box-sizing:border-box}
  .row{display:flex;align-items:center;gap:8px;margin-top:8px}
  .row label{font-size:12px;color:#9B98A8}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:10px;padding:11px 12px;
    border-bottom:1px solid #1F1D27}
  li .ic{font-size:20px;flex:0 0 auto}
  li .meta{flex:1 1 auto;min-width:0}
  li .nm{font-size:15px;line-height:1.3;word-break:break-all}
  li .sub{font-size:11px;color:#9B98A8;margin-top:3px}
  li.sel{background:#1C2438}
  .empty{padding:28px 16px;text-align:center;color:#9B98A8;font-size:14px}
  #mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20}
  #sheet{position:fixed;left:0;right:0;bottom:0;background:#17161D;display:none;
    z-index:21;border-top:1px solid #2E2B38;padding:10px 12px 18px;
    max-height:80%;overflow:auto}
  #sheet h3{margin:2px 0 10px;font-size:15px;word-break:break-all}
  #sheet button{display:block;width:100%;margin-bottom:8px;padding:11px;font-size:14px;
    text-align:left}
  #toast{position:fixed;left:0;right:0;bottom:14px;text-align:center;
    color:#fff;font-size:13px;pointer-events:none;z-index:40;display:none}
  #toast span{background:rgba(20,20,26,.94);padding:9px 14px;border-radius:8px;
    display:inline-block;max-width:88%}
  #editor textarea{height:56vh;font-family:monospace;font-size:12px}
  .tag{font-size:10px;background:#2A2733;color:#9B98A8;padding:1px 5px;
    border-radius:4px;margin-left:5px}
</style>
</head>
<body>
<header>
  <div class="crumb" id="crumb">…</div>
  <div class="bar">
    <button onclick="switchTab('file')" class="pri" id="tabFile">文件</button>
    <button onclick="switchTab('app')" id="tabApp">应用管理</button>
    <span id="rootState" class="tag">?</span>
  </div>

  <div id="fileBar">
    <div class="bar">
      <button onclick="up()">↑ 上级</button>
      <button onclick="pickRoot()">快捷位置</button>
      <button onclick="toggleSel()">多选</button>
      <button onclick="doSearch()">搜索</button>
      <button class="pri" onclick="fileEl.click()">↑ 上传到此处</button>
      <button onclick="newDir()">新建目录</button>
      <button onclick="paste()">粘贴</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="rmBox" onchange="toggleRoot()"> root 模式（看/改系统目录）</label>
    </div>
  </div>

  <div id="appBar" style="display:none">
    <div class="bar">
      <button onclick="loadApps('')">全部</button>
      <button onclick="loadApps('thirdparty')">只看我装的</button>
      <button onclick="loadApps('system')">只看系统自带</button>
      <button onclick="appSearch()">按名字搜</button>
      <button onclick="loadApps(curAppFilter)">刷新</button>
    </div>
  </div>
</header>

<ul id="list"></ul>
<div class="empty" id="empty" style="display:none"></div>
<input type="file" id="fileEl" multiple style="display:none" onchange="upload(this)">

<div id="mask" onclick="closeSheet()"></div>
<div id="sheet"></div>
<div id="toast"><span id="toastText"></span></div>

<script>
// 全部走 XHR：安卓老 WebView 没有 fetch / ES6 语法
var KEY = (function () {
  var m = location.search.match(/[?&]k=([^&]*)/);
  return m ? decodeURIComponent(m[1]) : '';
})();
var S = { path: '', items: [], rootMode: 0, selMode: false, sel: {}, clip: null, ancestors: [] };

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
// 拼 onclick="fn('...')" 用的字符串转义：先反斜杠再引号（只转义 ' 会放过 x\');alert(1)// 这类二阶 XSS）
function jsq(s) {
  return esc(String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
}
function toast(msg) {
  var t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._tm);
  t._tm = setTimeout(function () { t.style.display = 'none'; }, 2600);
}
function xhr(path, cb, method, body) {
  var x = new XMLHttpRequest();
  x.open(method || 'GET', path + (path.indexOf('?') < 0 ? '?' : '&') + 'k=' + encodeURIComponent(KEY), true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4) { return; }
    var j = null;
    try { j = JSON.parse(x.responseText); } catch (e) { }
    if (!j) { cb({ ok: false, error: '服务返回异常（端口没起？）' }); return; }
    cb(j);
  };
  x.onerror = function () { cb({ ok: false, error: '网络错误' }); };
  x.send(body || null);
}
function Q(extra) {
  return 'rm=' + (S.rootMode ? 1 : 0) + extra;
}

// ---------------------------------------------------------------- 列表
function load(path) {
  S.path = path || S.path;
  xhr('/api/list?path=' + encodeURIComponent(S.path) + '&' + Q(''), function (j) {
    if (!j.ok) {
      S.items = []; S.sel = {};   // 列目录失败：清掉旧条目，防止多选/粘贴作用在旧目录上
      document.getElementById('crumb').textContent = S.path;
      document.getElementById('list').innerHTML = '';
      var e = document.getElementById('empty');
      e.style.display = 'block';
      e.innerHTML = esc(j.error || '打不开') + (j.hintRoot ? '<br><br>试试右上角勾「root 模式」' : '');
      return;
    }
    S.items = j.items;
    render();
  });
}
function render() {
  var ul = document.getElementById('list');
  ul.innerHTML = '';
  var empty = document.getElementById('empty');
  if (TAB === 'app') {
    for (var k = 0; k < (S.apps || []).length; k++) { ul.appendChild(renderAppItem(S.apps[k])); }
    empty.style.display = (S.apps && S.apps.length) ? 'none' : 'block';
    empty.textContent = '没有匹配的应用';
    return;
  }
  var c = document.getElementById('crumb');
  c.textContent = S.path;
  empty.style.display = S.items.length ? 'none' : 'block';
  empty.textContent = '空目录';
  for (var i = 0; i < S.items.length; i++) {
    (function (it) {
      var li = document.createElement('li');
      if (S.selMode && S.sel[it.path]) { li.className = 'sel'; }
      var ic = document.createElement('div');
      ic.className = 'ic';
      ic.textContent = it.dir ? '\uD83D\uDCC1' : (/\.(apk)$/i.test(it.name) ? '\uD83D\uDCE6'
        : (/\.(png|jpe?g|gif|bmp|webp)$/i.test(it.name) ? '\uD83D\uDDBC'
          : (/\.(mp4|avi|mkv|mov)$/i.test(it.name) ? '\uD83C\uDFA5'
            : (/\.(mp3|wav|flac|ogg)$/i.test(it.name) ? '\uD83C\uDFB5' : '\uD83D\uDCC4'))));
      li.appendChild(ic);

      var meta = document.createElement('div');
      meta.className = 'meta';
      var nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = it.name;
      meta.appendChild(nm);
      var sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = (it.dir ? '目录' : it.sizeText) + '  ' + it.timeText
        + (it.perms ? '  ' + it.perms : '');
      meta.appendChild(sub);
      li.appendChild(meta);

      if (S.selMode) {
        var box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = !!S.sel[it.path];
        box.onclick = function (ev) {
          ev.stopPropagation();
          if (box.checked) { S.sel[it.path] = it; } else { delete S.sel[it.path]; }
          render();
        };
        li.appendChild(box);
      } else {
        var more = document.createElement('button');
        more.textContent = '⋯';
        more.onclick = function (ev) { ev.stopPropagation(); menu(it); };
        li.appendChild(more);
      }
      li.onclick = function () {
        if (S.selMode) {
          if (S.sel[it.path]) { delete S.sel[it.path]; } else { S.sel[it.path] = it; }
          render();
          return;
        }
        if (it.dir) { load(it.path); } else { menu(it); }
      };
      ul.appendChild(li);
    })(S.items[i]);
  }
}
function up() {
  load(S.path.replace(/\/[^/]*\/?$/, '') || '/');
}
function pickRoot() {
  xhr('/api/info?' + Q(''), function (j) {
    if (!j.ok) { toast(j.error || '取不到'); return; }
    var html = '<h3>快捷位置</h3>';
    for (var i = 0; i < j.roots.length; i++) {
      html += '<button onclick="load(\'' + jsq(j.roots[i]) + '\')">'
        + esc(j.roots[i]) + '</button>';
    }
    html += '<button class="danger" onclick="closeSheet()">取消</button>';
    sheet(html);
  });
}
function toggleRoot() {
  S.rootMode = document.getElementById('rmBox').checked ? 1 : 0;
  load();
}
function checkRoot() {
  xhr('/api/info?' + Q(''), function (j) {
    var el = document.getElementById('rootState');
    if (j.ok && j.root) {
      el.textContent = '车机有 root';
      document.getElementById('rmBox').checked = true;
      S.rootMode = 1;
    } else {
      el.textContent = '无 root（只能看 sdcard）';
    }
    load(j.ok ? (j.home || '/sdcard') : '/sdcard');
  });
}

// ---------------------------------------------------------------- 操作面板
function sheet(html) {
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('sheet').style.display = 'block';
  document.getElementById('mask').style.display = 'block';
}
function closeSheet() {
  document.getElementById('sheet').style.display = 'none';
  document.getElementById('mask').style.display = 'none';
}
function menu(it) {
  S.propsItem = it;   // 「属性」直接用列表里已有的 size/时间/权限，不再整读一遍文件
  var p = jsq(it.path);
  var html = '<h3>' + esc(it.name) + '</h3>';
  if (it.dir) {
    html += '<button onclick="load(\'' + p + '\')">进入</button>';
    html += '<button onclick="dlZip(\'' + p + '\')">打包下载 zip</button>';
  } else {
    html += '<button onclick="dl(\'' + p + '\')">下载到手机</button>';
    if (/\.apk$/i.test(it.name)) {
      html += '<button class="pri" onclick="inst(\'' + p + '\')">安装到车机</button>';
    }
    html += '<button onclick="edit(\'' + p + '\')">查看 / 编辑文本</button>';
  }
  html += '<button onclick="askCopy(\'' + p + '\',0)">复制</button>';
  html += '<button onclick="askCopy(\'' + p + '\',1)">剪切</button>';
  html += '<button onclick="askRename(\'' + p + '\',\'' + jsq(it.name) + '\')">重命名</button>';
  html += '<button onclick="askProps()">属性</button>';
  html += '<button class="danger" onclick="askDelete(\'' + p + '\',\'' + jsq(it.name) + '\','
    + (it.dir ? 1 : 0) + ')">删除</button>';
  html += '<button onclick="closeSheet()">取消</button>';
  sheet(html);
}
function dl(p) { location.href = '/api/dl?path=' + encodeURIComponent(p) + '&k=' + encodeURIComponent(KEY); }
function dlZip(p) { location.href = '/api/zip?path=' + encodeURIComponent(p) + '&k=' + encodeURIComponent(KEY); }
function inst(p) {
  closeSheet();
  toast('车机上开始安装…');
  xhr('/api/install?path=' + encodeURIComponent(p) + '&' + Q(''), function (j) {
    toast(j.ok ? (j.result || '已触发') : (j.error || '失败'));
  });
}
function op(opName, src, dst, cb) {
  xhr('/api/op?op=' + opName + '&src=' + encodeURIComponent(src)
    + (dst ? '&dst=' + encodeURIComponent(dst) : '') + '&' + Q(''), function (j) {
      cb(j);
    });
}
function askRename(p, old) {
  var nn = prompt('新名称', old);
  if (!nn || nn === old) { return; }
  op('rename', p, p.replace(/\/[^/]*$/, '') + '/' + nn, function (j) {
    toast(j.ok ? '已重命名' : (j.error || '失败'));
    closeSheet(); load();
  });
}
function askCopy(p, move) {
  S.clip = { path: p, move: move };
  toast(move ? '已剪切' : '已复制');
  closeSheet();
}
function paste() {
  if (!S.clip) { toast('剪贴板为空'); return; }
  var to = S.path;
  op(S.clip.move ? 'move' : 'copy', S.clip.path, to, function (j) {
    toast(j.ok ? '完成' : (j.error || '失败'));
    S.clip = null; load();
  });
}
function askDelete(p, name, isDir) {
  if (!confirm('删除 ' + name + ' ？' + (isDir ? '\n目录内的全部内容都会被删掉，无法恢复！' : ''))) { return; }
  op('delete', p, null, function (j) {
    toast(j.ok ? '已删除' : (j.error || '删除失败'));
    closeSheet(); load();
  });
}
function askProps() {
  var it = S.propsItem;
  if (!it) { toast('没有可显示的条目'); return; }
  var lines = ['名称：' + it.name, '路径：' + it.path,
    '类型：' + (it.dir ? '目录' : '文件'),
    '大小：' + (it.dir ? '-' : (it.sizeText || '?')),
    '时间：' + (it.timeText || '?')];
  if (it.perms) { lines.push('权限：' + it.perms); }
  alert(lines.join('\n'));
}
function newDir() {
  var n = prompt('新建目录名', '');
  if (!n) { return; }
  op('mkdir', S.path.replace(/\/$/, '') + '/' + n, null, function (j) {
    toast(j.ok ? '已创建' : (j.error || '创建失败'));
    load();
  });
}
function toggleSel() {
  S.selMode = !S.selMode;
  S.sel = {};
  render();
  toast(S.selMode ? '多选模式：点条目选中' : '已退出多选');
}
function doSearch() {
  var q = prompt('在当前目录（含子目录，最多 4 层）搜文件名', '');
  if (!q) { return; }
  xhr('/api/search?path=' + encodeURIComponent(S.path) + '&q=' + encodeURIComponent(q) + '&' + Q(''),
    function (j) {
      if (!j.ok || !j.items.length) { toast('没找到'); return; }
      var html = '<h3>搜索结果 ' + j.items.length + ' 项</h3>';
      for (var i = 0; i < j.items.length && i < 100; i++) {
        var it = j.items[i];
        html += '<button onclick="load(\'' + jsq(it.parent)
          + '\')">' + esc(it.name) + '<br><span style="color:#9B98A8;font-size:11px">'
          + esc(it.path) + '</span></button>';
      }
      html += '<button class="danger" onclick="closeSheet()">关闭</button>';
      sheet(html);
    });
}

// ---------------------------------------------------------------- 文本编辑
function edit(p) {
  closeSheet();
  xhr('/api/text?path=' + encodeURIComponent(p) + '&' + Q(''), function (j) {
    if (!j.ok) { toast(j.error || '读不到'); return; }
    var html = '<div id="editor"><h3>' + esc(p.split('/').pop()) + '</h3>'
      + '<textarea id="ta" spellcheck="false"></textarea>'
      + '<div class="bar" style="margin-top:8px">'
      + '<button class="pri" onclick="save(\'' + jsq(p) + '\')">保存到车机</button>'
      + '<button onclick="closeSheet()">关闭</button></div>'
      + '<div style="color:#9B98A8;font-size:11px;margin-top:6px">'
      + (j.truncated ? '（文件过大，只显示前 512KB，保存会截断，慎用）' : '')
      + (j.canWrite ? '' : '（该位置不可写，保存会失败）') + '</div></div>';
    sheet(html);
    document.getElementById('ta').value = j.text;
  });
}
function save(p) {
  var t = document.getElementById('ta').value;
  xhr('/api/save?path=' + encodeURIComponent(p) + '&' + Q(''), function (j) {
    toast(j.ok ? '已保存' : (j.error || '保存失败'));
    if (j.ok) { closeSheet(); load(); }
  }, 'POST', t);
}

// ---------------------------------------------------------------- 上传
function upload(input) {
  var fs = input.files;
  if (!fs || !fs.length) { return; }
  var i = 0;
  function next() {
    if (i >= fs.length) { input.value = ''; load(); return; }
    var f = fs[i];
    var fd = new FormData();
    fd.append('file', f, f.name);
    var x = new XMLHttpRequest();
    // 手写 XHR 而不是走 xhr() 包装：FormData 要自己 send。k 必须带上，
    // 否则服务端鉴权直接拒（v1.6.18 修：之前漏了导致上传 100% 失败）
    x.open('POST', '/api/up?path=' + encodeURIComponent(S.path) + '&' + Q('')
      + '&k=' + encodeURIComponent(KEY), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      var j = null;
      try { j = JSON.parse(x.responseText); } catch (e) { }
      if (j && j.ok) { toast('已上传 ' + j.name); }
      else { toast('上传失败：' + ((j && j.error) || '未知')); }
      i++; next();
    };
    x.onerror = function () { toast('上传出错'); i++; next(); };
    x.send(fd);
  }
  toast('开始上传 ' + fs.length + ' 个文件…');
  next();
}

var fileEl = document.getElementById('fileEl');
var TAB = 'file';
var curAppFilter = '';

function switchTab(which) {
  TAB = which;
  document.getElementById('tabFile').className = (which === 'file' ? 'pri' : '');
  document.getElementById('tabApp').className = (which === 'app' ? 'pri' : '');
  document.getElementById('fileBar').style.display = (which === 'file' ? '' : 'none');
  document.getElementById('appBar').style.display = (which === 'app' ? '' : 'none');
  document.getElementById('crumb').textContent = (which === 'file' ? S.path : '车机已安装应用');
  if (which === 'app' && !S.apps) { loadApps(''); } else { render(); }
}

// ---------------------------------------------------------------- 应用管理
function loadApps(filter) {
  curAppFilter = filter || '';
  xhr('/api/apps?sys=' + encodeURIComponent(curAppFilter), function (j) {
    if (!j.ok) { toast(j.error || '取不到应用列表'); return; }
    S.apps = j.items;
    S.rootAvail = j.root;
    var el = document.getElementById('rootState');
    el.textContent = j.root ? '车机有 root（可静默卸载）' : '无 root（卸载要点车机确认）';
    document.getElementById('crumb').textContent = '车机已安装应用（' + j.items.length + '）';
    render();
  });
}
function appSearch() {
  var q = prompt('搜包名或应用名关键字', '');
  if (q === null) { return; }
  xhr('/api/apps?q=' + encodeURIComponent(q) + '&sys=' + encodeURIComponent(curAppFilter),
    function (j) {
      if (!j.ok) { toast(j.error || '取不到'); return; }
      S.apps = j.items;
      render();
    });
}
function renderAppItem(a) {
  var li = document.createElement('li');
  var ic = document.createElement('div');
  ic.className = 'ic';
  ic.textContent = a.system ? '\u2699' : '\uD83D\uDCE6';
  li.appendChild(ic);
  var meta = document.createElement('div');
  meta.className = 'meta';
  var nm = document.createElement('div');
  nm.className = 'nm';
  nm.textContent = a.name + (a.system ? '  [系统]' : '');
  meta.appendChild(nm);
  var sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = a.pkg + '  v' + a.ver + '(' + a.code + ')  ' + fmtTime(a.time);
  meta.appendChild(sub);
  li.appendChild(meta);
  var more = document.createElement('button');
  more.textContent = '⋯';
  more.onclick = function (ev) { ev.stopPropagation(); appMenu(a); };
  li.appendChild(more);
  li.onclick = function () { appMenu(a); };
  return li;
}
function fmtTime(ms) {
  if (!ms) { return ''; }
  var d = new Date(ms);
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  return (d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function appMenu(a) {
  var p = jsq(a.pkg);
  var html = '<h3>' + esc(a.name) + '</h3>';
  html += '<button onclick="launchApp(\'' + p + '\')">打开这个应用</button>';
  html += '<button onclick="askUninstall(\'' + p + '\',\'' + jsq(a.name) + '\',0,'
    + (a.system ? 1 : 0) + ')">卸载</button>';
  html += '<button onclick="askUninstall(\'' + p + '\',\'' + jsq(a.name) + '\',1,'
    + (a.system ? 1 : 0) + ')">卸载但保留数据</button>';
  html += '<button class="danger" onclick="closeSheet()">取消</button>';
  sheet(html);
}
function launchApp(pkg) {
  closeSheet();
  xhr('/api/op?op=launch&src=' + encodeURIComponent(pkg) + '&' + Q(''), function (j) {
    toast(j.ok ? (j.result || '已打开') : (j.error || '打不开'));
  });
}
function askUninstall(pkg, name, keep, isSystem) {
  var msg = '卸载 ' + name + ' ？';
  if (isSystem) {
    msg += '\n\n⚠ 这是系统自带应用，卸载可能导致车机功能异常（设置、Launcher 等），确定要卸？';
  } else if (keep) {
    msg += '\n（保留数据，重装后可以恢复）';
  }
  if (!confirm(msg)) { return; }
  xhr('/api/op?op=uninstall&src=' + encodeURIComponent(pkg)
    + (keep ? '&dst=keep' : '') + '&' + Q(''), function (j) {
      toast(j.ok ? (j.result || '已卸载') : (j.error || '卸载失败'));
      closeSheet();
      loadApps(curAppFilter);
    });
}

checkRoot();
</script>
