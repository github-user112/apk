<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarLife 日志下载</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #17161B;
    color: #E8E6F0;
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px;
    overflow: hidden;
  }
  #qrs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    width: 100%;
  }
  .cell { margin: 4px 10px; text-align: center; }
  .qr {
    background: #FFFFFF;
    padding: 8px;
    border-radius: 8px;
    display: inline-block;
    line-height: 0;
  }
  .qr img { display: block; width: 200px; height: 200px; }
  .qr svg { display: block; width: 200px; height: 200px; }
  .u {
    margin-top: 6px;
    font-size: 14px;
    color: #C9C6D4;
    word-break: break-all;
    max-width: 260px;
  }
  /* 1.19：备选地址只列文字，不再各生成一个二维码 —— 扫到错的那个就是"打不开" */
  #alts {
    margin-top: 4px;
    font-size: 12px;
    color: #8B8896;
    text-align: center;
    line-height: 1.6;
    word-break: break-all;
    max-width: 92%;
  }
  #tips {
    margin-top: 8px;
    font-size: 14px;
    color: #C9C6D4;
    text-align: center;
  }
  .none { font-size: 15px; color: #E0A0A0; padding: 24px; }
</style>
</head>
<body>
  <div id="qrs"></div>
  <div id="alts"></div>
  <div id="tips">手机接入与车机相同的网络后，扫描二维码下载日志</div>
<script src="qrcode.js"></script>
<script>
(function () {
  var raw = location.hash ? location.hash.substring(1) : '';
  try { raw = decodeURIComponent(raw); } catch (e) { }
  var urls = [];
  if (raw) {
    var parts = raw.split(',');
    for (var i = 0; i < parts.length; i++) {
      if (parts[i]) { urls.push(parts[i]); }
    }
  }
  var box = document.getElementById('qrs');
  var alts = document.getElementById('alts');
  if (!urls.length) {
    box.innerHTML = '<div class="none">未检测到可用网络地址</div>';
    return;
  }

  // 1.19：只给**首选地址**生成二维码。
  // 地址在 Java 侧已按「对端可达性」排过序（直连 > WiFi > 热点 > 有线），
  // urls[0] 就是最可能扫得开的那个。1.18 是前 3 个各画一个二维码，
  // 真机上正好扫到蜂窝那张 —— 蜂窝地址对端永远够不着，表现就是"打不开"。
  var url = urls[0];
  var cell = document.createElement('div');
  cell.className = 'cell';
  var qbox = document.createElement('div');
  qbox.className = 'qr';
  cell.appendChild(qbox);
  var lab = document.createElement('div');
  lab.className = 'u';
  lab.appendChild(document.createTextNode(url));
  cell.appendChild(lab);
  box.appendChild(cell);

  var html = '';
  try {
    var qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    try { html = qr.createImgTag(6, 2); } catch (e1) { html = ''; }
    if (!html) { html = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); }
  } catch (e) {
    html = '';
    lab.appendChild(document.createTextNode('  (二维码生成失败)'));
  }
  if (html) { qbox.innerHTML = html; }

  // 其余地址降级成小字，只供手动输入，不再生成二维码
  if (urls.length > 1) {
    var s = '备选：';
    for (var k = 1; k < urls.length; k++) {
      s += (k > 1 ? '   ' : '') + urls[k];
    }
    alts.appendChild(document.createTextNode(s));
  }
})();
</script>
</body>
</html>
