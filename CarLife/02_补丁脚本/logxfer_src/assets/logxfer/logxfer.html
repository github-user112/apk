<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarLife 日志下载</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #17161B;
    color: #E8E6F0;
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px;
    overflow: hidden;
  }
  #qrs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    width: 100%;
  }
  .cell { margin: 4px 10px; text-align: center; }
  .qr {
    background: #FFFFFF;
    padding: 8px;
    border-radius: 8px;
    display: inline-block;
    line-height: 0;
  }
  .qr img { display: block; width: 190px; height: 190px; }
  .qr svg { display: block; width: 190px; height: 190px; }
  .u {
    margin-top: 5px;
    font-size: 13px;
    color: #9B98A8;
    word-break: break-all;
    max-width: 220px;
  }
  #tips {
    margin-top: 8px;
    font-size: 14px;
    color: #C9C6D4;
    text-align: center;
  }
  .none { font-size: 15px; color: #E0A0A0; padding: 24px; }
</style>
</head>
<body>
  <div id="qrs"></div>
  <div id="tips">手机接入与车机相同的网络后，扫描二维码下载日志</div>
<script src="qrcode.js"></script>
<script>
(function () {
  var raw = location.hash ? location.hash.substring(1) : '';
  try { raw = decodeURIComponent(raw); } catch (e) { }
  var urls = [];
  if (raw) {
    var parts = raw.split(',');
    for (var i = 0; i < parts.length; i++) {
      if (parts[i]) { urls.push(parts[i]); }
    }
  }
  var box = document.getElementById('qrs');
  if (!urls.length) {
    box.innerHTML = '<div class="none">未检测到可用网络地址</div>';
    return;
  }
  var limit = Math.min(urls.length, 3);
  for (var k = 0; k < limit; k++) {
    var url = urls[k];
    var cell = document.createElement('div');
    cell.className = 'cell';
    var qbox = document.createElement('div');
    qbox.className = 'qr';
    cell.appendChild(qbox);
    var lab = document.createElement('div');
    lab.className = 'u';
    lab.appendChild(document.createTextNode(url));
    cell.appendChild(lab);
    box.appendChild(cell);
    var html = '';
    try {
      var qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      try { html = qr.createImgTag(6, 2); } catch (e1) { html = ''; }
      if (!html) { html = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); }
    } catch (e) {
      html = '';
      lab.appendChild(document.createTextNode('  (二维码生成失败)'));
    }
    if (html) { qbox.innerHTML = html; }
  }
})();
</script>
</body>
</html>
